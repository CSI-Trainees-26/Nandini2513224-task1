<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="login-page">
    <section class="login-box">
        <div class="logo">UNI<span>Sphere</span></div>

        <h1>Student Login</h1>
        <p class="login-subtitle">
            Explore colleges, rankings, accreditations and placements.
        </p>
        <form action="home.html" method="get">
            <div class="form-group">
                <label for="user-id">Student User ID</label>
                <input
                    type="text"
                    id="user-id"
                    name="user-id"
                    placeholder="Enter your user ID"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button class="login-button" type="submit">Login & Explore!</button>
        </form>
    </section>
</main>

</body>
</html>
